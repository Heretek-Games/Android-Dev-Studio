<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heretek 3D Android Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #09090b; }
    canvas { width: 100%; height: 100%; display: block; }
    #joystick-container {
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #joystick-thumb {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.85);
      border: 2px solid #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5);
    }
    #jump-btn {
      position: absolute;
      bottom: 32px;
      right: 32px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.9);
      border: 2px solid #fde68a;
      color: white;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="joystick-container">
    <div id="joystick-thumb"></div>
  </div>
  <div id="jump-btn">JUMP</div>

  <script>
    // Native Android Bridge Interface check
    if (window.AndroidBridge) {
      window.AndroidBridge.log('Init', 'Game container initialized in Android System WebView.');
    }

    const jumpBtn = document.getElementById('jump-btn');
    jumpBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (window.AndroidBridge) window.AndroidBridge.vibrate(25);
    });
  </script>
</body>
</html>
