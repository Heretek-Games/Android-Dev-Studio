<!doctype html>
<html><head><meta charset="utf-8"><title>sync probe</title></head>
<body>
<script>
// Experiment 1 (delta-loop spike): fixed-dt waypoint stepper for 3 instances.
// Mirrors EngineContext.step(1/60) cadence without engine weight: the spike
// measures transport + pacing, not gameplay cost.
(function () {
  var DT = 1 / 60;
  var acc = 0, last = performance.now(), t = 0;
  // slot, basePos, amplitude, speed, phase per mover
  var movers = [
    { slot: 0, base: [0, 2, 0], amp: 6, speed: 0.6, phase: 0.0 },
    { slot: 1, base: [0, 2, 0], amp: 6, speed: 0.9, phase: 2.1 },
    { slot: 2, base: [0, 2, 0], amp: 6, speed: 1.3, phase: 4.2 }
  ];
  function step() {
    var parts = [];
    for (var i = 0; i < movers.length; i++) {
      var m = movers[i];
      var x = m.base[0] + Math.sin(t * m.speed + m.phase) * m.amp;
      parts.push(m.slot + ',' + x.toFixed(3) + ',' + m.base[1] + ',' + m.base[2]);
    }
    if (window.Sync && window.Sync.push) window.Sync.push(parts.join(';'));
  }
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= DT) { t += DT; acc -= DT; step(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body></html>
