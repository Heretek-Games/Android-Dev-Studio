<!doctype html>
<html><head><meta charset="utf-8"><title>sync probe</title></head>
<body>
<script>
// Experiment 1 (delta-loop spike): fixed-dt waypoint stepper for 3 instances.
// Driven explicitly via __probeTick (evaluateJavascript) rather than rAF, so
// hidden/offscreen throttling cannot silently stop the probe. Mirrors
// EngineContext.step(1/60) cadence without engine weight: the spike measures
// transport + pacing, not gameplay cost.
(function () {
  var DT = 1 / 60;
  var acc = 0, last = -1, t = 0, m0x = 0;
  // slot, basePos, amplitude, speed, phase per mover
  var movers = [
    { slot: 0, base: [0, 2, 0], amp: 6, speed: 0.6, phase: 0.0 },
    { slot: 1, base: [0, 2, 0], amp: 6, speed: 0.9, phase: 2.1 },
    { slot: 2, base: [0, 2, 0], amp: 6, speed: 1.3, phase: 4.2 }
  ];
  window.__probeTick = function (nowMs, inputX) {
    if (last < 0) last = nowMs;
    acc += Math.min(0.1, (nowMs - last) / 1000);
    last = nowMs;
    var stepped = 0;
    while (acc >= DT) { t += DT; acc -= DT; stepped++; }
    if (stepped === 0) return '';
    // Experiment 2: mover 0 eases toward the tap-driven target offset.
    var target = (typeof inputX === 'number' && isFinite(inputX)) ? inputX * 10 : 0;
    m0x += (target - m0x) * Math.min(1, stepped * DT * 3);
    var parts = [];
    for (var i = 0; i < movers.length; i++) {
      var m = movers[i];
      var x = (i === 0) ? m0x : m.base[0] + Math.sin(t * m.speed + m.phase) * m.amp;
      parts.push(m.slot + ',' + x.toFixed(3) + ',' + m.base[1] + ',' + m.base[2]);
    }
    var payload = parts.join(';');
    if (window.Sync && window.Sync.push) window.Sync.push(payload);
    return payload;
  };
})();
</script>
</body></html>
